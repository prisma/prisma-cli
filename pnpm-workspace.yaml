packages:
  - packages/*

allowBuilds:
  esbuild: true
  # Transitive arrivals from composer's constellation. Neither build runs
  # any code this repo executes: workerd's postinstall only links the
  # platform binary from its own optional dependency, and msgpackr-extract
  # compiles a native accelerator that falls back to JavaScript.
  msgpackr-extract: false
  workerd: false

# First-party SDKs we publish from our own CI (with npm provenance) and consume
# the same day. minimumReleaseAge is a quarantine for untrusted third-party
# publishes; it's the wrong threat model for packages we build ourselves, and
# provenance is the stronger control for "is this really our build". Exempt at
# the package level rather than re-pinning each version on every release.
minimumReleaseAgeExclude:
  - '@prisma/compute-sdk'
  - '@prisma/management-api-sdk'
  # Reached through @prisma/composer, which pins it exactly.
  - '@prisma/cli-engine'
