name: Prepare CLI Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version strategy for the release PR
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - custom
      custom_version:
        description: Exact version when release_type is custom, for example 3.0.0-alpha.2
        required: false
        type: string
      dry_run:
        description: Validate the release PR without creating a branch or pull request
        required: false
        type: boolean
        default: false

concurrency:
  group: prepare-cli-release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Ensure workflow runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow only prepares releases from main."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release PR version
        id: cli_version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          if [ "${RELEASE_TYPE}" = "custom" ] && [ -z "${CUSTOM_VERSION}" ]; then
            echo "custom_version is required when release_type=custom."
            exit 1
          fi

          if [ "${RELEASE_TYPE}" = "alpha" ]; then
            npm --prefix packages/cli version prerelease --preid alpha --no-git-tag-version >/dev/null
          elif [ "${RELEASE_TYPE}" = "custom" ]; then
            npm --prefix packages/cli version "${CUSTOM_VERSION}" --no-git-tag-version >/dev/null
          else
            echo "Unsupported release_type: ${RELEASE_TYPE}"
            exit 1
          fi

          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/cli/package.json', 'utf8')).version)")"
          printf 'version=%s\n' "${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fail if version already exists on npm
        run: |
          PACKAGE='@prisma/cli'
          VERSION='${{ steps.cli_version.outputs.version }}'
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} already exists on npm."
            exit 1
          fi

      - name: Fail if release tag already exists
        run: |
          VERSION='${{ steps.cli_version.outputs.version }}'
          TAG="cli-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists."
            exit 1
          fi

      - name: Run focused CLI tests
        run: pnpm --filter @prisma/cli test

      - name: Build CLI package
        run: pnpm --filter @prisma/cli build

      - name: Prepare staged publish package
        run: node scripts/prepare-cli-publish.mjs .publish/cli

      - name: Ensure release PR still targets the latest main
        if: ${{ !inputs.dry_run }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved while the release PR was being prepared. Rerun the workflow from the latest main."
            exit 1
          fi

      - name: Create release pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cli_version.outputs.version }}
        run: |
          BRANCH="chore/release-cli-${VERSION}"
          TITLE="chore(cli): release @prisma/cli v${VERSION}"

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Release branch ${BRANCH} already exists."
            exit 1
          fi

          git checkout -b "${BRANCH}"
          git add packages/cli/package.json
          if git diff --cached --quiet; then
            echo "No CLI version change was produced."
            exit 1
          fi

          git commit -m "${TITLE}"
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body "Bumps \`@prisma/cli\` to \`${VERSION}\` for the next preview release."

      - name: Summarize release preparation
        run: |
          VERSION='${{ steps.cli_version.outputs.version }}'
          {
            echo "## Prepare CLI Release"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            if [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo "- Branch: skipped"
              echo "- Pull request: skipped"
            else
              echo "- Branch: \`chore/release-cli-${VERSION}\`"
              echo "- Pull request: created"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
